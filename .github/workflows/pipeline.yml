name: CI e entrega da imagem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  container:
    name: Construir, testar e publicar
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Construir imagem
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          docker build --build-arg APP_VERSION="$COMMIT_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" \
            -t devops-api:test .
      - name: Testar container em execucao
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker run -d --name api --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8000:8000 devops-api:test
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health
          curl --fail -s http://127.0.0.1:8000/version | \
            python -c 'import json,os,sys; assert json.load(sys.stdin)["version"] == os.environ["COMMIT_SHA"]'
      - name: Publicar a mesma imagem testada no GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker tag devops-api:test "$IMAGE:sha-$COMMIT_SHA"
          docker tag devops-api:test "$IMAGE:latest"
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:latest"
          echo "Imagem publicada: $IMAGE:sha-$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs e limpeza
        if: always()
        run: |
          docker logs api || true
          docker rm -f api || true
          docker logout ghcr.io || true
